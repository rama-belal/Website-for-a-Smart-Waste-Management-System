<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Reports</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #B5B89B, #D4D0B9);
      color: #394931;
      margin: 0;
      padding: 20px;
    }

    .header {
      font-size: 24px;
      font-weight: bold;
      position: absolute;
      top: 20px;
      left: 20px;
    }

    .back-button {
      position: absolute;
      top: 20px;
      right: 20px;
      background: none;
      color: #394931;
      border: none;
      padding: 10px 16px;
      border-radius: 10px;
      cursor: pointer;
      font-weight: bold;
      transition: transform 0.3s, background-color 0.3s;
    }

    .back-button:hover {
      transform: scale(1.1);
      background-color: #e0e0e0;
    }

    .reports-container {
      margin-top: 70px;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      margin-left: 20px;
    }

    .report-item {
      background: rgba(255, 255, 255, 0.2);
      border-radius: 10px;
      padding: 15px;
      width: 100%;
      max-width: 700px;
      margin-bottom: 10px;
      box-shadow: 0px 4px 8px rgba(0, 0, 0, 0.2);
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }

    .buttons-group {
      display: flex;
      gap: 8px;
    }

    .details-btn {
      background-color:#627a56;
      color: white;
      border: none;
      padding: 5px 10px;
      border-radius: 5px;
      cursor: pointer;
      font-size: 14px;
    }

    .details-btn:hover {
      background-color: #4a6042;
    }

    .delete-btn {
      background-color: #a33d3d;
      color: white;
      border: none;
      padding: 5px 10px;
      border-radius: 5px;
      cursor: pointer;
      font-size: 14px;
    }

    .delete-btn:hover {
      background-color: #7e2e2e;
    }

    .modal {
      display: none;
      position: fixed;
      z-index: 1;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0,0,0,0.5);
      justify-content: center;
      align-items: center;
    }

    .modal-content {
      background-color: white;
      padding: 30px;
      border-radius: 10px;
      max-width: 400px;
      text-align: center;
    }

    .close-btn {
      margin-top: 10px;
      padding: 8px 15px;
      background-color: red;
      color: white;
      border: none;
      cursor: pointer;
      border-radius: 5px;
    }

    .close-btn:hover {
      background-color: darkred;
    }
  </style>
</head>
<body>
<div class="header">Reports</div>
<button class="back-button" onclick="goBack()">← Back</button>

<div class="reports-container" id="reports-list">
  <p>Loading reports...</p>
</div>

<div id="report-modal" class="modal">
  <div class="modal-content">
    <h3>Report Details</h3>
    <p id="report-details"></p>
    <button class="close-btn" onclick="closeModal()">Close</button>
  </div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/9.6.1/firebase-app.js";
  import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyDz-ex7zcF0CReaLGqUHlIXKcD4aHcn5xU",
    authDomain: "smart-waste-bbff1.firebaseapp.com",
    projectId: "smart-waste-bbff1",
    storageBucket: "smart-waste-bbff1.appspot.com",
    messagingSenderId: "891805348084",
    appId: "1:891805348084:web:14a784cb2daa6ef0442ea1",
    measurementId: "G-8GG920MZ6R"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  window.goBack = function () {
    window.location.href = "Homepage.html";
  };

  async function fetchReports() {
    const reportsContainer = document.getElementById("reports-list");
    reportsContainer.innerHTML = "<p>Loading reports...</p>";

    try {
      const reports = await getDocs(collection(db, "reports"));
      const workerReports = await getDocs(collection(db, "reportworker"));

      reportsContainer.innerHTML = "";

      // Reports from 'reports' collection
      reports.forEach((doc) => {
      const data = doc.data();
      const binNumber = data.bin_number || "web form ";
      const timestamp = new Date(data.timestamp?.seconds * 1000).toLocaleString();
      const description = data.description?.trim() || "No details provided.";
      const name = data.name || "Unknown";
      const phone = data.phone_num || "N/A";
      const reportId = doc.id;

  const element = document.createElement("div");
  element.classList.add("report-item");
  element.innerHTML = `
    <span>${binNumber} - ${timestamp}</span>
    <div class="buttons-group">
      <button class="details-btn" onclick="viewDetails(
        \`${description}\`,
        \`${timestamp}\`,
        \`${name}\`,
        \`${phone}\`
      )">View Details</button>
      <button class="delete-btn" onclick="deleteReport('${reportId}')">Delete</button>
    </div>
  `;
  reportsContainer.appendChild(element);
});

      // Reports from 'reportworker' collection
      workerReports.forEach((doc) => {
  const data = doc.data();
  const timestamp = new Date(data.timestamp?.seconds * 1000).toLocaleString();
  const description = data.reportContent || "No details";
  const name = data.fullName || "Unknown";
  const status = data.status || "Unknown";
  const userId = data.userId || "N/A";
  const reportId = doc.id;

  const element = document.createElement("div");
  element.classList.add("report-item");
  element.innerHTML = `
    <span>Worker Report - ${timestamp}</span>
    <div class="buttons-group">
      <button class="details-btn" onclick="viewDetails(
        \`${description} (Status: ${status})\`,
        \`${timestamp}\`,
        \`${name}\`,
        \`User ID: ${userId}\`
      )">View Details</button>
      <button class="delete-btn" onclick="deleteWorkerReport('${reportId}')">Delete</button>
    </div>
  `;
  reportsContainer.appendChild(element);
});

    } catch (error) {
      console.error("❌ Error fetching reports:", error);
      reportsContainer.innerHTML = "<p>Failed to load reports.</p>";
    }
  }

  window.deleteReport = async function (reportId) {
    if (!confirm("Delete this report?")) return;

    try {
      const response = await fetch(`http://localhost:8080/reports/delete/${reportId}`, {
        method: "DELETE"
      });
      if (!response.ok) {
        throw new Error("Server returned status " + response.status);
      }
      fetchReports();
    } catch (error) {
      console.error("❌ Error deleting report:", error);
      alert("Failed to delete report.");
    }
  };

  window.deleteWorkerReport = async function (reportId) {
  if (!confirm("Delete this worker report?")) return;

  try {
    const response = await fetch(`http://localhost:8080/reports/delete-worker/${reportId}`, {
      method: "DELETE"
    });
    if (!response.ok) {
      throw new Error("Server returned status " + response.status);
    }
    fetchReports();
  } catch (error) {
    console.error("❌ Error deleting worker report:", error);
    alert("Failed to delete worker report.");
  }
};

  window.viewDetails = function(description, timestamp, name, phoneOrUserId) {
    const detailsText = `
      <strong>Time:</strong> ${timestamp}<br>
      <strong>Description:</strong> ${description}<br>
      <strong>User:</strong> ${name}<br>
      <strong>Contact:</strong> ${phoneOrUserId}
    `;
    document.getElementById("report-details").innerHTML = detailsText;
    document.getElementById("report-modal").style.display = "flex";
  };

  window.closeModal = function () {
    document.getElementById("report-modal").style.display = "none";
  };

  fetchReports();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Authentication</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">

    <!-- Firebase -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #B5B89B, #D4D0B9);
            color: #394931;
            text-align: center;
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .auth-container {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 20px;
            padding: 30px;
            width: 90%;
            max-width: 650px;
            box-shadow: 0px 4px 12px rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(10px);
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.3);
        }
        .auth-container h2 {
            margin-bottom: 15px;
        }
        input {
            width: 90%;
            padding: 12px;
            margin: 10px 0;
            border: none;
            border-radius: 8px;
            font-size: 16px;
        }
        .auth-button {
            width: 100%;
            padding: 12px;
            margin-top: 10px;
            border: none;
            border-radius: 10px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            background-color: white;
            color: #394931;
            transition: 0.3s;
        }
        .auth-button:hover {
            transform: scale(1.05);
            background-color: #e0e0e0;
        }
        .toggle-text {
            margin-top: 10px;
            font-size: 14px;
            cursor: pointer;
            color: blue;
            text-decoration: underline;
        }
    </style>
</head>
<body>

<div class="auth-container">
    <h2 id="auth-title">Sign Up</h2>
    <input type="email" id="email" placeholder="Enter your email">
    <input type="password" id="password" placeholder="Enter your password">
    <input type="password" id="confirm-password" placeholder="Confirm your password">

    <button class="auth-button" id="auth-button" onclick="signup()">Sign Up</button>

    <p id="switch-text" class="toggle-text" onclick="toggleAuth()">Already have an account? Login</p>
    <p id="forgot-password" class="toggle-text" style="display: none;" onclick="resetPassword()">Forgot your password?</p>
</div>

<script>
    const firebaseConfig = {
     apiKey: "AIzaSyDz-ex7zcF0CReaLGqUHlIXKcD4aHcn5xU",
     authDomain: "smart-waste-bbff1.firebaseapp.com",
     projectId: "smart-waste-bbff1",
     storageBucket: "smart-waste-bbff1.firebasestorage.app",
     messagingSenderId: "891805348084",
     appId: "1:891805348084:web:14a784cb2daa6ef0442ea1",
     measurementId: "G-8GG920MZ6R"
 };
   firebase.initializeApp(firebaseConfig);
   const auth = firebase.auth();

   let isSignup = true;

   function toggleAuth() {
       isSignup = !isSignup;

       document.getElementById("auth-title").innerText = isSignup ? "Sign Up" : "Login";
       document.getElementById("auth-button").innerText = isSignup ? "Sign Up" : "Login";
       document.getElementById("auth-button").setAttribute("onclick", isSignup ? "signup()" : "login()");

       document.getElementById("confirm-password").style.display = isSignup ? "block" : "none";
       document.getElementById("forgot-password").style.display = isSignup ? "none" : "block";

       document.getElementById("switch-text").innerHTML = isSignup
           ? 'Already have an account? <span onclick="toggleAuth()">Login</span>'
           : 'Don’t have an account? <span onclick="toggleAuth()">Sign Up</span>';
   }

   function signup() {
       const email = document.getElementById("email").value;
       const password = document.getElementById("password").value;
       const confirmPassword = document.getElementById("confirm-password").value;

       if (password !== confirmPassword) {
           alert("Passwords do not match!");
           return;
       }

       auth.createUserWithEmailAndPassword(email, password)
           .then(() => {
               alert("Sign Up Successful! Redirecting...");
               window.location.href = "Homepage.html";
           })
           .catch((error) => {
               alert(error.message);
           });
   }

   function login() {
       const email = document.getElementById("email").value;
       const password = document.getElementById("password").value;

       auth.signInWithEmailAndPassword(email, password)
           .then(() => {
               alert("Login Successful! Redirecting...");
               window.location.href = "Homepage.html";
           })
           .catch((error) => {
               alert(error.message);
           });
   }

   function resetPassword() {
       const email = document.getElementById("email").value;
       if (!email) {
           alert("Enter your email first.");
           return;
       }

       auth.sendPasswordResetEmail(email)
           .then(() => alert("Password reset email sent!"))
           .catch((error) => alert(error.message));
   }
</script>

</body>
</html>
